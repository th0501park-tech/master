{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- Breadcrumb -->
    <nav class="flex items-center space-x-2 text-xs text-gray-500 mb-6">
        <a href="/" class="hover:text-blue-600">홈</a>
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
        <a href="/board/qna" class="hover:text-blue-600">질문과 답변 (Q&A)</a>
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
        <span class="text-gray-900 font-semibold">질문 작성하기</span>
    </nav>

    <div class="mb-6">
        <h1 class="text-2xl font-black text-gray-900">새 질문 작성하기</h1>
        <p class="text-xs text-gray-500 mt-1">문의 사항을 작성해 주시면 담당 직원이 확인 후 신속하게 답변해 드립니다.</p>
    </div>

    <!-- Form Card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8">
        <form action="/board/qna/new" method="post" class="space-y-6">

            <!-- Category & Author -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">문의 분류 <span class="text-red-500">*</span></label>
                    <select name="category" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white">
                        <option value="일반문의">일반문의</option>
                        <option value="견적/단가">견적 / 대량할인 문의</option>
                        <option value="인쇄/시안">상호 / 로고 인쇄 시안 문의</option>
                        <option value="배송문의">배송 / 납기 일정 문의</option>
                        <option value="기타">기타 문의</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">작성자명 <span class="text-red-500">*</span></label>
                    <input 
                        type="text" 
                        name="author" 
                        required 
                        placeholder="이름 또는 회사명 입력" 
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white"
                    >
                </div>
            </div>

            <!-- Password & Secret Option -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1.5">비밀번호 (조회/수정용) <span class="text-red-500">*</span></label>
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        placeholder="4자리 이상 입력" 
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white"
                    >
                </div>
                <div class="flex items-center pt-6">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="is_secret" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500" checked>
                        <span class="ml-2 text-xs font-bold text-gray-700">비밀글로 등록 (작성자와 관리자만 확인)</span>
                    </label>
                </div>
            </div>

            <!-- Title -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">제목 <span class="text-red-500">*</span></label>
                <input 
                    type="text" 
                    name="title" 
                    required 
                    placeholder="질문 제목을 입력하세요." 
                    class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white"
                >
            </div>

            <!-- Content -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">질문 내용 <span class="text-red-500">*</span></label>
                <textarea 
                    name="content" 
                    rows="6" 
                    required 
                    placeholder="궁금하신 내용을 구체적으로 작성해 주시면 더욱 정확하고 빠른 답변이 가능합니다."
                    class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white leading-relaxed"
                ></textarea>
            </div>

            <!-- Buttons -->
            <div class="pt-4 flex justify-end space-x-3">
                <a href="/board/qna" class="px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition">
                    취소
                </a>
                <button type="submit" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center">
                    <i class="fa-solid fa-check mr-1.5"></i>질문 등록하기
                </button>
            </div>

        </form>
    </div>

</div>
{% endblock %}
