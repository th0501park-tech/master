{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto px-3 sm:px-6 lg:px-8 py-6 sm:py-8">

    <!-- Breadcrumb -->
    <nav class="flex items-center space-x-1.5 sm:space-x-2 text-xs text-gray-500 mb-4 sm:mb-6 overflow-x-auto scrollbar-none py-1">
        <a href="/" class="hover:text-blue-600 shrink-0">홈</a>
        <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 shrink-0"></i>
        <a href="/board/notice" class="hover:text-blue-600 shrink-0">공지사항</a>
        <i class="fa-solid fa-chevron-right text-[10px] text-gray-400 shrink-0"></i>
        <span class="text-gray-900 font-semibold truncate">{{ post.title }}</span>
    </nav>

    <!-- Notice Card -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 sm:p-6 sm:p-10 mb-6">
        <div class="pb-4 sm:pb-6 border-b border-gray-100">
            <div class="flex flex-wrap items-center gap-2 mb-2 text-xs text-gray-400">
                {% if post.is_pinned %}
                <span class="px-2 py-0.5 bg-red-100 text-red-700 font-bold text-[10px] rounded shrink-0">공지</span>
                {% endif %}
                <span>등록일: {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}</span>
                <span>|</span>
                <span>조회수: {{ post.views }}</span>
            </div>
            <h1 class="text-xl sm:text-2xl md:text-3xl font-black text-gray-900 leading-snug">{{ post.title }}</h1>
        </div>

        <!-- Body -->
        <div class="py-6 sm:py-8 text-xs sm:text-sm text-gray-800 leading-relaxed whitespace-pre-line border-b border-gray-100 min-h-[140px]">
            {{ post.content }}
        </div>

        <!-- Back Button -->
        <div class="pt-4 sm:pt-6 flex justify-end">
            <a href="/board/notice" class="w-full sm:w-auto px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-xs rounded-xl transition text-center">
                <i class="fa-solid fa-list mr-1.5"></i>목록으로
            </a>
        </div>
    </div>

</div>
{% endblock %}
