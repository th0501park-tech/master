<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 sm:p-10">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-700 to-indigo-900 rounded-2xl flex items-center justify-center text-white font-black text-2xl mx-auto mb-3 shadow-lg">
                BS
            </div>
            <h1 class="text-xl font-black text-gray-900">{{ settings.COMPANY_NAME }}</h1>
            <p class="text-xs text-gray-500 mt-1">통합 관리자 인증 시스템</p>
        </div>

        {% if error %}
        <div class="mb-6 p-3.5 bg-red-50 border border-red-200 rounded-xl text-xs text-red-600 font-semibold flex items-center">
            <i class="fa-solid fa-circle-exclamation mr-2 text-sm"></i>
            아이디 또는 비밀번호가 일치하지 않습니다.
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/admin/login" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">관리자 아이디</label>
                <div class="relative">
                    <input 
                        type="text" 
                        name="username" 
                        required 
                        placeholder="아이디 입력 (기본: admin)" 
                        value="admin"
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white"
                    >
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1.5">비밀번호</label>
                <div class="relative">
                    <input 
                        type="password" 
                        name="password" 
                        required 
                        placeholder="비밀번호 입력 (기본: admin1234)" 
                        class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-blue-600 focus:bg-white"
                    >
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-400 text-xs"></i>
                </div>
            </div>

            <div class="pt-2">
                <button 
                    type="submit" 
                    class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-black text-sm rounded-xl shadow-lg hover:shadow-xl transition"
                >
                    로그인
                </button>
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center text-xs text-gray-400">
            <a href="/" class="hover:text-gray-600 transition flex items-center justify-center space-x-1">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>쇼핑몰 메인으로 돌아가기</span>
            </a>
        </div>
    </div>

</body>
</html>
